</head>
<body>

<div class="page-header">
  <h1>🗺️ Map & Route Planner</h1>
  <p>Find charging stations and plan your journey</p>
</div>

<section class="section">
  <div class="map-layout">

    <!-- LEFT PANEL -->
    <div style="display:flex;flex-direction:column;gap:1.5rem">

      <!-- Route Planner -->
      <div class="route-panel">
        <h3>🛣️ Route Planner</h3>
        <div class="form-group">
          <label>From</label>
          <input type="text" id="fromLoc" value="Anna Nagar, Chennai" placeholder="Your location" />
        </div>
        <div class="form-group">
          <label>Destination</label>
          <input type="text" id="toLoc" placeholder="e.g. Velachery, Chennai" />
        </div>
        <div class="form-group">
          <label>Current Battery Level</label>
          <div class="range-group">
            <input type="range" id="batSlider" min="5" max="100" value="75" step="1" />
            <span class="range-val" id="batVal">75%</span>
          </div>
        </div>
        <div class="form-group">
          <label>Battery Capacity (kWh)</label>
          <select id="batCap">
            <option value="30">30 kWh – Small EV</option>
            <option value="45">45 kWh – Tata Nexon</option>
            <option value="60" selected>60 kWh – Mid Range</option>
            <option value="82">82 kWh – MG ZS EV</option>
            <option value="100">100 kWh – Premium</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="planRoute()">⚡ Plan Route</button>
        <div id="routeResult"></div>
      </div>

      <!-- Charge Calculator -->
      <div class="route-panel">
        <h3>🔋 Charge Calculator</h3>
        <div class="form-group">
          <label>Charge From (%)</label>
          <input type="number" id="chargeFrom" value="20" min="0" max="99" />
        </div>
        <div class="form-group">
          <label>Charge To (%)</label>
          <input type="number" id="chargeTo" value="80" min="1" max="100" />
        </div>
        <div class="form-group">
          <label>Charger Speed (kW)</label>
          <select id="chargeSpeed">
            <option value="7">7 kW – Home/Slow AC</option>
            <option value="22">22 kW – Fast AC</option>
            <option value="50" selected>50 kW – DC Fast</option>
            <option value="150">150 kW – Ultra-Fast</option>
            <option value="250">250 kW – Hyper Fast</option>
          </select>
        </div>
        <div class="form-group">
          <label>Battery Capacity (kWh)</label>
          <input type="number" id="vehicleCap" value="60" min="10" max="150" />
        </div>
        <button class="btn btn-primary" onclick="calcCharge()">Calculate →</button>
        <div id="chargeResult"></div>
      </div>
    </div>

    <!-- MAP -->
    <div>
      <div id="map"></div>
      <p style="text-align:center;font-size:0.8rem;color:#6b7280;margin-top:0.75rem">
        ⚡ Click any marker to see station details
      </p>
    </div>

  </div>
</section>

<footer>
  <p>© 2025 <span>Volt路</span> · Built for EV drivers across India</p>
</footer>

<div class="notif" id="notif"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/main.js"></script>
</body>
</html>
